name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allows a manual re-deploy from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits for the in-flight one rather than cancelling it, so a
# deploy is never interrupted half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No version pinned here on purpose: the action reads the
      # "packageManager" field in package.json, so CI and local stay in step.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          # Overrides the fallback in content/site.ts so canonical URLs, the
          # sitemap and the RSS feed all point at the real domain.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
